---
name: Pull Request
on:
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
# holden:ignore:HLD_CI_017 — org-owned reusable workflow, intentionally tracked at @main to pick up pipeline fixes
  pr:
    uses: JamesWoolfenden/.github/.github/workflows/terraform-pr-gcp.yml@main
