suppressions:
  # HLD_GCP_466 (gcs-cmek-ordered) fires against the vendored terraform-gcp-storage
  # module's google_storage_bucket resource (only visible when a local
  # .terraform/modules/storage cache happens to exist, e.g. after pike-docs-go
  # runs during pre-commit). The suggested fix — add depends_on to the bucket
  # resource — can't be applied here: that resource lives in a different repo,
  # and the flagged file itself is a git-ignored, machine-managed cache copy.
  #
  # Verified with `terraform graph` in example/examplea (the actual caller that
  # supplies kms_key_name) that the ordering IS enforced, just via a 3-hop chain
  # holden's static analysis can't trace across two module boundaries:
  #   google_storage_bucket_object.{index,robots}
  #     -> module.storage.google_storage_bucket.pike (bucket = module.storage.bucket.name)
  #     -> data.google_project.pike                   (bucket's `project = data.google_project.pike.name`)
  #     -> google_kms_crypto_key_iam_member.gcs_encrypt (via module.helmrepo's own
  #                                                       depends_on cascading onto its
  #                                                       direct sibling data.google_project.pike)
  # So the KMS IAM grant is always applied before the bucket or its objects,
  # via data.google_project.pike as the connecting node — not a missing
  # dependency, just one the engine can't see through this many hops.
  - policy_id: HLD_GCP_466
    module: module.storage
    reason: >-
      Verified via terraform graph: bucket -> data.google_project.pike ->
      google_kms_crypto_key_iam_member.gcs_encrypt is a real 3-hop chain
      (project = data.google_project.pike.name, plus module.helmrepo's
      depends_on cascading onto that same data source). Ordering is enforced;
      holden can't trace it across two module boundaries. See example/examplea
      for the resources this depends on.
  - policy_id: HLD_GCP_466
    module: module.helmrepo
    reason: >-
      Same as the module.storage entry above — this is the resource_id prefix
      holden reports when scanning from example/examplea, where module.helmrepo
      wraps module.storage.
